<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vagas disponíveis - Menu lateral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vagas_listagem.css">
</head>
<body>
<div class="app">

  <!-- Menu de navegação -->
  <aside class="sidebar">
    <!-- Título -->
    <div class="brand">
      <div class="brand-logo">P</div>
      <div class="brand-text">
        <div class="brand-name">Residencial Aurora</div>
        <div class="brand-sub">Estacionamento</div>
      </div>
    </div>

    <!-- Navegação -->
    <nav class="menu" aria-label="Menu principal">

      <!-- Reservar Vaga -->
      <a href="reservar.html" class="menu-link" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
        Reservar Vaga
      </a>

      <!-- Listagem de vagas -->
      <a href="listagem_vaga.html" class="menu-link menu-link--ativo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <path d="M9 7v10M9 7h3a3 3 0 0 1 0 6H9"></path>
        </svg>
          Vagas
      </a>

      <!-- Listagem de veículos -->
      <a href="listagem_veiculo.html" class="menu-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 17h14l1-6-2-5H6l-2 5 1 6Z"></path>
          <path d="M4 11h16M7 17v2M17 17v2"></path>
          <circle cx="7.5" cy="14" r="1"></circle>
          <circle cx="16.5" cy="14" r="1"></circle>
        </svg>
        Veículos
      </a>

      <!-- Listagem de residências -->
      <a href="listagem_residencia.html" class="menu-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 10 9-7 9 7"></path>
          <path d="M5 9v11h14V9"></path>
          <path d="M9 20v-7h6v7"></path>
        </svg>
        Residências
      </a>

      <!-- Minha Conta -->
      <a href="minha_conta.html" class="menu-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21a8 8 0 0 1 16 0"></path>
        </svg>
        Minha Conta
      </a>
    </nav>

    <!-- Administração -->
    <div class="user">
      <div class="user-info">
        <div class="user-avatar">AD</div>
        <div class="user-nome">Administração</div>
      </div>

      <!-- Sair -->
      <a href="login.html" class="user-sair">Sair</a>
    </div>
  </aside>

  <main class="conteudo">

    <div class="topo">
      <div class="topo-titulo">
        <h1>Vagas disponíveis</h1>
        <p>Veja quais vagas estão livres e quem ocupa as demais.</p>
      </div>
    </div>

    <!-- Filtros de busca -->
    <div id="filtro-container" class="filtro-container">
      <div id="filtros" class="filtros" role="group" aria-label="Filtrar vagas"></div>

      <div class="filtro-side">
        <div class="stats">
          <div class="stat"><b id="stat-totais">12</b><span>totais</span></div>
          <div class="stat"><b id="stat-ocupadas">7</b><span>ocupadas</span></div>
          <div class="stat stat--livres"><b id="stat-livres">5</b><span>livres</span></div>
        </div>
        <div class="filtro-cadastro">
          <!-- Listagem de Vagas -->
          <a href="cadastro_vaga.html" class="menu-link menu-link--ativo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="3"></rect>
              <path d="M12 8v8M8 12h8"></path>
            </svg>
            Cadastrar Vaga
          </a>
        </div>
      </div>
    </div>

    <div id="grade" class="grade"></div>

  </main>
</div>

<script src="js/vagas_listagem.js"></script>
</body>
</html>
