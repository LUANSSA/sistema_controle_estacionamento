<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar vaga - Residencial Aurora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cadastro_vaga.css">
</head>
<body>
  <div class="app">

    <!-- Menu de navegação -->
    <aside class="sidebar">
      <!-- Título -->
      <div class="brand">
        <div class="brand-logo">P</div>
        <div class="brand-text">
          <div class="brand-name">Residencial Aurora</div>
          <div class="brand-sub">Estacionamento</div>
        </div>
      </div>

      <!-- Navegação -->
      <nav class="menu" aria-label="Menu principal">

        <!-- Reservar Vaga -->
        <a href="reservar.html" class="menu-link" aria-current="page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <path d="M12 8v8M8 12h8"></path>
          </svg>
          Reservar Vaga
        </a>

        <!-- Listagem de vagas -->
        <a href="listagem_vaga.html" class="menu-link menu-link--ativo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <path d="M9 7v10M9 7h3a3 3 0 0 1 0 6H9"></path>
          </svg>
            Vagas
        </a>

        <!-- Listagem de veículos -->
        <a href="listagem_veiculo.html" class="menu-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 17h14l1-6-2-5H6l-2 5 1 6Z"></path>
            <path d="M4 11h16M7 17v2M17 17v2"></path>
            <circle cx="7.5" cy="14" r="1"></circle>
            <circle cx="16.5" cy="14" r="1"></circle>
          </svg>
          Veículos
        </a>

        <!-- Listagem de residências -->
        <a href="listagem_residencia.html" class="menu-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7"></path>
            <path d="M5 9v11h14V9"></path>
            <path d="M9 20v-7h6v7"></path>
          </svg>
          Residências
        </a>

        <!-- Minha Conta -->
        <a href="minha_conta.html" class="menu-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21a8 8 0 0 1 16 0"></path>
          </svg>
          Minha Conta
        </a>
      </nav>

      <!-- Administração -->
      <div class="user">
        <div class="user-info">
          <div class="user-avatar">AD</div>
          <div class="user-nome">Administração</div>
        </div>

        <!-- Sair -->
        <a href="login.html" class="user-sair">Sair</a>
      </div>
    </aside>
    <main class="conteudo">
      <header class="topo">
        <div class="topo-titulo">
          <h1>Cadastrar vaga</h1>
          <p>Preencha as informações abaixo para adicionar uma vaga ao estacionamento.</p>
        </div>
      </header>

      <section class="formulario-container" aria-labelledby="titulo-formulario">
        <div class="formulario-cabecalho">
          <div class="formulario-icone" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"></rect>
              <path d="M12 8v8M8 12h8"></path>
            </svg>
          </div>
          <div>
            <h2 id="titulo-formulario">Informações da vaga</h2>
            <p>Os campos marcados com <span class="obrigatorio">*</span> são obrigatórios.</p>
          </div>
        </div>

        <form id="form-vaga" class="formulario" action="#" method="post">
          <div class="campo">
            <label for="numero">Número ou identificação da vaga <span class="obrigatorio">*</span></label>
            <input type="text" id="numero" name="numero" placeholder="Ex.: V-01" required>
          </div>

          <div class="campo">
            <label for="bloco">Bloco</label>
            <input type="text" id="bloco" name="bloco" placeholder="Ex.: Bloco A">
          </div>

          <div class="campo">
            <label for="andar">Andar / nível <span class="obrigatorio">*</span></label>
            <select id="andar" name="andar" required>
              <option value="" selected disabled>Selecione o andar</option>
              <option value="terreo">Térreo</option>
              <option value="subsolo-1">Subsolo 1</option>
              <option value="subsolo-2">Subsolo 2</option>
              <option value="subsolo-3">Subsolo 3</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div class="campo">
            <label for="tipo">Tipo de vaga <span class="obrigatorio">*</span></label>
            <select id="tipo" name="tipo" required>
              <option value="" selected disabled>Selecione o tipo</option>
              <option value="carro">Carro</option>
              <option value="moto">Motocicleta</option>
              <option value="pcd">Acessível (PCD)</option>
              <option value="visitante">Visitante</option>
            </select>
          </div>

          <div class="campo">
            <label for="localizacao">Localização / referência</label>
            <input type="text" id="localizacao" name="localizacao" placeholder="Ex.: Próximo ao elevador">
          </div>

          <div class="campo">
            <label for="status">Status inicial <span class="obrigatorio">*</span></label>
            <select id="status" name="status" required>
              <option value="livre" selected>Livre</option>
              <option value="ocupada">Ocupada</option>
              <option value="manutencao">Em manutenção</option>
            </select>
          </div>

          <div class="campo campo--largura-total">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" rows="4" placeholder="Adicione alguma informação relevante sobre esta vaga..."></textarea>
          </div>

          <div class="formulario-acoes campo--largura-total">
            <a href="reservar.html" class="botao botao--secundario">Cancelar</a>
            <button type="submit" class="botao botao--primario">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14M12 5l7 7-7 7"></path>
              </svg>
              Cadastrar vaga
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- Javascript -->
  <script src="api/vagas.js"></script>
  <script src="js/vaga_cadastro.js"></script>
</body>
</html>
